[project]
name = "jobapp"
version = "0.1.0"
description = "Job Board REST API built on Django + DRF"
readme = "Readme.md"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "django>=5.2.15,<6",
    "django-cors-headers>=4.9.0",
    "django-filter>=25.2",
    "djangorestframework==3.16.1",
    "djangorestframework-simplejwt==5.5.1",
    "drf-spectacular>=0.29.0",
    "langchain>=1.3,<2",
    "langchain-google-genai>=4.2,<5",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "psycopg2-binary==2.9.10",
    "psycopg[binary,pool]>=3.2,<4",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
]

[tool.uv]
package = false
